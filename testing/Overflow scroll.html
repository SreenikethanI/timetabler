<!DOCTYPE html>
<html><head>
    <style>
        .header {
        height: 50px;
        }

        .body { /*#builder-courses-container*/
        position: absolute;
        top: 50px;
        right: 0;
        bottom: 0;
        left: 0;

        display: flex;
        }

        .main { /*#builder-courses-available-container*/
        /*   flex: 1; */
        display: flex;
        flex-direction: column;
        }

        .content { /*#builder-courses-available-scroller*/
        /*   flex: 1; */
        display: flex;
        overflow: auto;
        }

        .box { /*.listbox*/
        display: flex;
        flex-direction: column;
        min-height: min-content;
        }









        .column { /*.listbox-item*/
        padding: 20px;
        border-right: 1px solid #999;
        height: 500px;
        background: red;
        }


















        /* All of these are just for this demo's design. */

        body {
        font-family: sans-serif;
        font-size: 20px;
        line-height: 50px;
        text-transform: uppercase;
        font-weight: bold;
        }

        .header {
        text-align: center;
        color: #fff;
        background: #444;
        }

        .sidebar {
        background: #666;
        padding: 4px 20px;
        color: #fff;
        }

        .page-header {
        padding: 6px 20px;
        background: #004141;
        color: #fff;
        font-size: .8em;
        }

        .content {
        background: #ddd;
        }
    </style>
</head><body>
    <div class="header">Main header</div>

    <div class="body"> <!-- #builder-courses-container -->

        <div class="main"> <!-- #builder-courses-available-container -->

            Click/tap on course to add:

            <div class="content"> <!-- #builder-courses-available-scroller -->

                <div class="box"> <!-- .listbox -->
                    <div class="column">Column 1</div> <!-- .listbox-item -->
                    <div class="column">Column 2</div> <!-- .listbox-item -->
                    <div class="column">Column 3</div> <!-- .listbox-item -->
                </div>

            </div>
        </div>

        <div class="sidebar">Sidebar bro</div> <!-- #builder-courses-selected-container -->

    </div>
</body></html>
